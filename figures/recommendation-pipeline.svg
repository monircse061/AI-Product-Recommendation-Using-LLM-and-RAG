<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-labelledby="title desc">
  <title id="title">Smart Picks recommendation pipeline</title>
  <desc id="desc">A multilingual user query enters a Gradio and FastAPI interface. LangChain coordinates semantic retrieval from OwnerClan through OpenAI embeddings and Qdrant, and product lookup from Naver. Three OwnerClan and two Naver products are combined, then Llama 3.1 8B uses retrieved context to generate a conversational recommendation with product details and images.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#52647a"/></marker>
    <marker id="arrowDashed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7b61a8"/></marker>
    <style>
      .h{font:700 28px Arial,sans-serif;fill:#16263a}.sub{font:16px Arial,sans-serif;fill:#52647a}
      .box{stroke:#71839a;stroke-width:2;rx:18;ry:18}.title{font:700 21px Arial,sans-serif;fill:#183047}.body{font:16px Arial,sans-serif;fill:#31465b}
      .small{font:15px Arial,sans-serif;fill:#42566d}.tag{font:700 15px Arial,sans-serif;fill:#fff}
      .line{fill:none;stroke:#52647a;stroke-width:3;marker-end:url(#arrow)}.dashed{fill:none;stroke:#7b61a8;stroke-width:2.5;stroke-dasharray:9 8;marker-end:url(#arrowDashed)}
    </style>
  </defs>
  <rect width="1400" height="1120" fill="#f7f9fc"/>
  <text x="700" y="54" text-anchor="middle" class="h">Smart Picks — Recommendation Pipeline</text>
  <text x="700" y="82" text-anchor="middle" class="sub">Semantic retrieval, RAG, LLM reasoning and multi-source product results</text>

  <rect x="430" y="112" width="540" height="94" class="box" fill="#e8f1ff"/>
  <text x="700" y="150" text-anchor="middle" class="title">1. User query</text>
  <text x="700" y="180" text-anchor="middle" class="body">Natural-language request (Korean / English; multilingual input as configured)</text>
  <path d="M700 206 V244" class="line"/>

  <rect x="430" y="246" width="540" height="90" class="box" fill="#e7f7f1"/>
  <text x="700" y="282" text-anchor="middle" class="title">2. Gradio chatbot + FastAPI</text>
  <text x="700" y="311" text-anchor="middle" class="body">Accepts the query and manages the user-facing interaction</text>
  <path d="M700 336 V374" class="line"/>

  <rect x="430" y="376" width="540" height="86" class="box" fill="#fff2d9"/>
  <text x="700" y="411" text-anchor="middle" class="title">3. LangChain orchestration</text>
  <text x="700" y="439" text-anchor="middle" class="body">Combines current query, conversation context and retrieval steps</text>

  <path d="M700 462 V490 H350 V520" class="line"/>
  <path d="M700 490 H1050 V520" class="line"/>

  <rect x="70" y="522" width="560" height="200" class="box" fill="#eaf2ff"/>
  <rect x="770" y="522" width="560" height="200" class="box" fill="#f0eaff"/>
  <rect x="92" y="542" width="170" height="30" rx="15" fill="#3266a8"/><text x="177" y="563" text-anchor="middle" class="tag">OWNERCLAN</text>
  <text x="350" y="593" text-anchor="middle" class="title">4A. Semantic product retrieval</text>
  <text x="350" y="628" text-anchor="middle" class="body">OpenAI text-embedding-ada-002</text>
  <text x="350" y="657" text-anchor="middle" class="body">Qdrant vector search (similarity + metadata filters)</text>
  <text x="350" y="689" text-anchor="middle" class="small">Retrieve and shortlist relevant catalogue items</text>
  <rect x="792" y="542" width="120" height="30" rx="15" fill="#7350a3"/><text x="852" y="563" text-anchor="middle" class="tag">NAVER</text>
  <text x="1050" y="593" text-anchor="middle" class="title">4B. External product lookup</text>
  <text x="1050" y="628" text-anchor="middle" class="body">Naver API or configured crawling path</text>
  <text x="1050" y="657" text-anchor="middle" class="body">Retrieve products matching the user request</text>
  <text x="1050" y="689" text-anchor="middle" class="small">Filter and shortlist relevant Naver items</text>

  <path d="M350 722 V755 H700 V790" class="line"/>
  <path d="M1050 722 V755 H700" class="line"/>
  <rect x="360" y="792" width="680" height="84" class="box" fill="#fff4df"/>
  <text x="700" y="826" text-anchor="middle" class="title">5. Merge the Top 5 recommendations</text>
  <text x="700" y="854" text-anchor="middle" class="body">3 OwnerClan products + 2 Naver products (current project configuration)</text>
  <path d="M700 876 V910" class="line"/>

  <rect x="360" y="912" width="680" height="90" class="box" fill="#e5f6ed"/>
  <text x="700" y="947" text-anchor="middle" class="title">6. RAG + LLaMA 3.1 8B reasoning</text>
  <text x="700" y="976" text-anchor="middle" class="body">Uses retrieved product context to prepare recommendations and alternatives</text>
  <path d="M700 1002 V1030" class="line"/>

  <rect x="260" y="1032" width="880" height="72" class="box" fill="#e9edf3"/>
  <text x="700" y="1061" text-anchor="middle" class="title">7. Display results in the chatbot</text>
  <text x="700" y="1087" text-anchor="middle" class="small">Product code · title · price · shipping cost · origin · image · conversational follow-up</text>
</svg>
